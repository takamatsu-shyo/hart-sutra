<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>般若心経 暗記</title><style>body{background:#f5f2eb;color:#302e28;font-family:system-ui;margin:0}main{max-width:600px;margin:auto;padding:20px}button{font:inherit;padding:14px;background:white;border:1px solid #bcb5a6;border-radius:9px;cursor:pointer;touch-action:manipulation}nav{display:flex;gap:8px;margin-bottom:20px}nav button{flex:1}.active,.next{background:#405b46;color:white}article{background:#fffefa;padding:20px;border-radius:15px}h2{text-align:center;font:30px serif}progress{width:100%;accent-color:#405b46}.options{display:grid;gap:10px}.options button{font:24px serif}.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}.tiles button{width:45px;height:50px;padding:0;font:26px serif}.tiles button:disabled{visibility:hidden}.good{background:#dcebd9}.bad{background:#f5dcd7}#feedback{min-height:30px;text-align:center}.next{width:100%}footer{font-size:13px;color:#716c60;margin-top:20px}#history{background:#eeeee5;border-radius:9px;padding:12px 15px;margin:14px 0;line-height:2;font:20px/1.9 serif;overflow-wrap:anywhere}#history small{display:block;font:13px system-ui;color:#716c60}#history .latest{color:#405b46;font-weight:bold}</style><main><h1>般若心経 暗記</h1><nav><button id="a">四択読経</button><button id="b">漢字並べ替え</button></nav><article id="game"></article><footer><details><summary>経文を確認する</summary><p id="full"></p></details>玄奘訳系の読誦本文。宗派により表記・区切りが異なります。題名は出題範囲外です。</footer></main><script>
const sutra = ['観自在菩薩','行深般若波羅蜜多時','照見五蘊皆空','度一切苦厄','舎利子','色不異空','空不異色','色即是空','空即是色','受想行識','亦復如是','舎利子','是諸法空相','不生不滅','不垢不浄','不増不減','是故空中','無色','無受想行識','無眼耳鼻舌身意','無色声香味触法','無眼界','乃至無意識界','無無明','亦無無明尽','乃至無老死','亦無老死尽','無苦集滅道','無智亦無得','以無所得故','菩提薩埵','依般若波羅蜜多故','心無罣礙','無罣礙故','無有恐怖','遠離一切顛倒夢想','究竟涅槃','三世諸仏','依般若波羅蜜多故','得阿耨多羅三藐三菩提',
'故知般若波羅蜜多','是大神呪','是大明呪','是無上呪','是無等等呪','能除一切苦','真実不虚','故説般若波羅蜜多呪','即説呪曰','羯諦羯諦','波羅羯諦','波羅僧羯諦','菩提薩婆訶','般若心経'];
const $=id=>document.getElementById(id), game=$('game'); $('full').textContent=sutra.join('　');
let mode='a',i=0,errors=0,done=false,chosen=[],tiles=[];
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(m){mode=m;i=0;errors=0;$('a').classList.toggle('active',m==='a');$('b').classList.toggle('active',m==='b');render()}
function button(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
function history(n){const box=document.createElement("div");box.id="history";box.setAttribute("aria-label","回答済みの経文");const label=document.createElement("small");label.textContent="回答済みの経文";box.append(label);if(!n){box.append("まだありません");return box}sutra.slice(0,n).forEach((phrase,j)=>{if(j)box.append("　");const span=document.createElement("span");span.textContent=phrase;if(j===n-1)span.className="latest";box.append(span)});return box}
function render(){done=false;chosen=[];if(i===sutra.length){game.innerHTML='<h2>一周完了</h2><p>全 '+sutra.length+' 句を練習しました。</p><p>間違い：'+errors+' 回</p>';game.append(history(i));game.append(button('もう一周する',()=>start(mode),'next'));return}
 game.innerHTML=`<div>${i+1} / ${sutra.length} 句　｜　間違い ${errors} 回</div><progress max="${sutra.length}" value="${i}"></progress><p>${i?'直前の句':'最初の句'}</p><h2>${i?sutra[i-1]:'摩訶般若波羅蜜多心経'}</h2><p>${mode==='a'?'次の句を選んでください。':'次の句を漢字のタップで作ってください。'}</p><div id="area"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="next" hidden>次へ</button>`;
 game.querySelector('progress').after(history(i));
 $('next').onclick=()=>{i++;render()};const target=sutra[i];
 if(mode==='a'){let area=$('area');area.className='options';let other=[...new Set(sutra)].filter(x=>x!==target);let opts=shuffle([target,...shuffle(other).slice(0,3)]);opts.forEach(x=>{let b=button(x,()=>{if(done)return;if(x===target){b.classList.add('good');success();area.querySelectorAll('button').forEach(c=>c.disabled=true)}else{errors++;b.classList.add('bad');b.disabled=true;$('feedback').textContent='もう一度選んでください。'}});area.append(b)})}
 else{tiles=shuffle(Array.from(target).map((c,id)=>({c,id})));if(tiles.map(t=>t.c).join('')===target&&new Set(target).size>1){let k=tiles.findIndex(t=>t.c!==tiles[0].c);[tiles[0],tiles[k]]=[tiles[k],tiles[0]]}drawTiles()}}
function success(){done=true;$('history').replaceWith(history(i+1));game.querySelector('progress').value=i+1;$('feedback').textContent='正解　'+sutra[i];$('next').hidden=false;$('next').focus()}
function drawTiles(){const area=$('area');area.innerHTML='';const slots=document.createElement('div');slots.className='tiles';Array.from(sutra[i]).forEach((_,j)=>{let t=chosen[j];let b=button(t?t.c:'□',()=>{if(!done&&t){chosen.splice(j,1);$('feedback').textContent='';drawTiles()}});b.disabled=done||!t; if(!t)b.style.visibility='visible';slots.append(b)});area.append(slots);const pool=document.createElement('div');pool.className='tiles';tiles.forEach(t=>{let b=button(t.c,()=>{if(done)return;chosen.push(t);$('feedback').textContent='';if(chosen.length===tiles.length){if(chosen.map(x=>x.c).join('')===sutra[i]){success()}else{errors++;$('feedback').textContent='順番が違います。上の漢字をタップして修正してください。'}}drawTiles()});b.disabled=done||chosen.some(x=>x.id===t.id);pool.append(b)});area.append(pool);if(!done){area.append(button('並べ直す',()=>{chosen=[];$('feedback').textContent='';drawTiles()}))}}
$('a').onclick=()=>start('a');$('b').onclick=()=>start('b');start('a');
</script></html>
